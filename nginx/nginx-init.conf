# Начальная конфигурация для получения SSL сертификата
# После получения сертификата заменить на nginx.conf

server {
    listen 80;
    server_name maxbot.bnw-tech.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
