upstream app_backend {
    server app:8000;
}

# HTTP — редирект на HTTPS + certbot challenge
server {
    listen 80;
    server_name maxbot.bnw-tech.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — основной сервер
server {
    listen 443 ssl;
    server_name maxbot.bnw-tech.ru;

    ssl_certificate /etc/letsencrypt/live/maxbot.bnw-tech.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maxbot.bnw-tech.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # Приложение (webhooks + NiceGUI админки /ui/admin_internal, /ui/admin_vk)
    location / {
        proxy_pass http://app_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket для NiceGUI
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
