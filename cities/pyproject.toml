[project]
name = "cities"
version = "0.1.0"
description = "Cities search API service"
authors = [
    {name = "firzat", email = "fmannanov01@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard] (>=0.116.1,<0.117.0)",
    "elasticsearch (>=8.17.0,<9.0.0)",
    "pydantic (>=2.10.4,<3.0.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "pydantic-settings (>=2.7.0,<3.0.0)",
    "sentry-sdk (>=2.35.1,<3.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.scripts]
cities = "uvicorn main:app --host 0.0.0.0 --port 8080"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"