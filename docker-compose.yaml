services:
  nginx:
    image: nginx:1.29-alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - media-facade

  rabbitmq:
    image: rabbitmq:4.1-alpine
    restart: always
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
  
  postgres:
    image: postgres:17.5-alpine
    restart: always
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=mydatabase
      - TZ=Europe/Moscow
    volumes:
      - postgres-data:/var/lib/postgresql/data

  bot:
    build:
      context: services/bot
      dockerfile: Dockerfile
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=mydatabase
      - RABBIT_HOST=rabbitmq
      - MESSAGES_TIME_OUT_MINUTES=0 # remove after testing
      - MAXIMUM_MESSAGES_PER_USER=1000 # remove after testing
      - MAXIMUM_ATTEMPTS_PER_MESSAGE=1000 # remove after testing
    env_file:
      - secrets.env
  
  media-facade:
    build:
      context: services/media_facade
      dockerfile: Dockerfile
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=mydatabase
      - RABBIT_HOST=rabbitmq
      - USE_MOCK=1
    env_file:
      - secrets.env
  
  # Auto Moderator Service
  auto-moderator-redis:
    image: redis:8.2.0-alpine
    restart: always
    volumes:
      - auto-moderator-redis:/data
    command: >
      redis-server
      --save 60 1
      --save 300 10
      --appendonly yes
      --appendfsync everysec

  auto-moderator:
    build:
      context: services/auto_moderator
      dockerfile: Dockerfile
    restart: always
    environment:
      - RABBIT_HOST=rabbitmq
      - REDIS_HOST=auto-moderator-redis
    env_file:
      - secrets.env
  
  black-list-bot:
    build:
      context: services/black_list_bot
      dockerfile: Dockerfile
    restart: always
    environment:
      - RABBIT_HOST=rabbitmq
      - REDIS_HOST=auto-moderator-redis
    env_file:
      - secrets.env
  
  # Manual Moderator Service
  manual-moderator-redis:
    image: redis:8.2.0-alpine
    restart: always
    volumes:
      - manual-moderator-redis:/data
    command: >
      redis-server
      --save 60 1
      --save 300 10
      --appendonly yes
      --appendfsync everysec

  manual-moderator:
    build:
      context: services/manual_moderator
      dockerfile: Dockerfile
    restart: always
    environment:
      - RABBIT_HOST=rabbitmq
      - REDIS_HOST=manual-moderator-redis
    env_file:
      - secrets.env
  

volumes:
  rabbitmq-data:
  postgres-data:
  manual-moderator-redis:
  auto-moderator-redis: