services:
  app:
    build:
      context: .
      dockerfile: max_bot/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      - CITIES_API_TOKEN=${CITIES_API_TOKEN:?CITIES_API_TOKEN is required}
      - CITIES_SERVICE_URL=https://cities:8080
      - CITIES_VERIFY_TLS=true
      - CITIES_CA_CERT=/certs/ca/ca.crt
      - REDIS_SSL=true
      - REDIS_CA_CERT=/certs/ca/ca.crt
      - POSTGRES_SSL=true
      - POSTGRES_CA_CERT=/certs/ca/ca.crt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cities:
        condition: service_healthy
    volumes:
      - ./max_bot/src:/home/app:rw
      - ./data:/home/app/data:rw
      - ./certs:/certs:ro

  postgres:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    env_file: .env
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/certs/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/certs/server.key
      - -c
      - ssl_ca_file=/etc/postgresql/certs/ca.crt
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command:
      - sh
      - -ec
      - |
        redis-server \
          --port 0 \
          --tls-port 6379 \
          --tls-cert-file /certs/redis/redis.crt \
          --tls-key-file /certs/redis/redis.key \
          --tls-ca-cert-file /certs/ca/ca.crt \
          --tls-auth-clients no \
          --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    volumes:
      - redis_data:/data
      - ./certs:/certs:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --tls --cacert /certs/ca/ca.crt -a $REDIS_PASSWORD ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: elasticsearch:8.15.4
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.certificate=/usr/share/elasticsearch/config/certs/elasticsearch/elasticsearch.crt
      - xpack.security.http.ssl.key=/usr/share/elasticsearch/config/certs/elasticsearch/elasticsearch.key
      - xpack.security.http.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./certs:/usr/share/elasticsearch/config/certs:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f --cacert /usr/share/elasticsearch/config/certs/ca/ca.crt -u elastic:$ELASTIC_PASSWORD https://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  cities:
    build: cities
    command:
      - poetry
      - run
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ssl-certfile
      - /certs/cities/cities.crt
      - --ssl-keyfile
      - /certs/cities/cities.key
    environment:
      - ELASTICSEARCH_URL=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
      - ELASTICSEARCH_VERIFY_CERTS=true
      - ELASTICSEARCH_CA_CERT=/certs/ca/ca.crt
      - CITIES_API_TOKEN=${CITIES_API_TOKEN:?CITIES_API_TOKEN is required}
    volumes:
      - ./data/cities.csv:${CITIES_FILE_PATH:-/home/cities/app/data/cities.csv}:ro
      - ./certs:/certs:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --cacert /certs/ca/ca.crt -H \"Authorization: Bearer $CITIES_API_TOKEN\" https://localhost:8080/cities/stats >/dev/null || curl -fsS --cacert /certs/ca/ca.crt -H \"Authorization: Bearer $CITIES_API_TOKEN\" https://localhost:8080/stats >/dev/null || exit 1",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
