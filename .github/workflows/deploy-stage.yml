name: Deploy

on:
  push:
    branches: [stage]

jobs:
  test-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/bot
    env:
      BOT_TOKEN: f9LHodD0cOK9FCQR5-mTNoXfQT4u7iEBPK2j3PoWO77zjySLFoWo9ial6RbOxydqoPHcNyTQE6orS3FQFVYp
      NAME_API_KEY: 60903c28-a108-43ea-95aa-7b50ed3d561f
      POSTGRES_USER: some user
      POSTGRES_PASSWORD: some password
      POSTGRES_DB: some database
      IS_TESTING: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir poetry==2.1.3
          poetry install --with dev

      - name: Run tests
        run: |
          poetry run pytest --disable-warnings -v

  copy:
    needs: test-bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Archive code for deploy
        run: |
          zip -r deploy.zip . -x '*.git*' '*.github/*'

      - name: Create secrets.env file
        run: |
          echo "SENTRY_DSN=http://52cb9f7304933df00e6f4dc2de598ba7@82.202.129.230:9000/4" >> secrets.env
          echo "BOT_TOKEN=f9LHodD0cOK9FCQR5-mTNoXfQT4u7iEBPK2j3PoWO77zjySLFoWo9ial6RbOxydqoPHcNyTQE6orS3FQFVYp" >> secrets.env
          echo "NAME_API_KEY=60903c28-a108-43ea-95aa-7b50ed3d561f" >> secrets.env
          echo "MISTRAL_API_KEY=f8ZUgmWSbWf0jP0nuhWUmppR6slkTTYn" >> secrets.env
          echo "TELEGRAM_BOT_TOKEN=8208310640:AAHX-vf-FsEfvHeeEIjvJFI0wDNyOO5XBkY" >> secrets.env
          echo "MAIN_ADMIN_ID=75178947" >> secrets.env
          echo "MEDIA_FACADE_API_TOKEN=c2776116-3537-45d4-81df-926e49974f86" >> secrets.env
          echo "SECRET_KEY=0d16efe6-8770-4ee6-a78d-f9cfae4a0fed" >> secrets.env
          echo "START_MESSAGE_IMAGE_TOKEN=uzz8EEFL1p4bKp3yXOov39UieRyxG2u5jFajHbjNbqtid+UEKpizOiRdYZLca73nfH8oYnwxLqqVVt5oeJA3t4GkJMU5TFnnKXZ4qcOz3DZob+NFxv7BFbsOfzL4Rh9C3fPRwRAnalxO45uS0xrmxmqWH92fK5ufbjNjpA/QyPg\u003d" >> secrets.env
          echo "GOOGLE_SHEET_ID=1Ef6OUBgWFuJcykGuJWt6zRIjad9aVNbZ8Hvu4ro9pxM" >> secrets.env
          echo "GOOGLE_ACCOUNT_CREDENTIALS=$(echo '' | base64 -d)" >> secrets.env
      - name: Transfer files to server
        uses: appleboy/scp-action@v1
        with:
          host: 83.222.26.189
          username: root
          key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
            QyNTUxOQAAACAtnFp+Y2e0VUmmNqzrkmDv25WbZrQO0oL0KLVUDa9+7wAAAJhPCWjrTwlo
            6wAAAAtzc2gtZWQyNTUxOQAAACAtnFp+Y2e0VUmmNqzrkmDv25WbZrQO0oL0KLVUDa9+7w
            AAAECpplG++laSSRORFuERvo7Miun9VFaeHJz3Y97hoe18oS2cWn5jZ7RVSaY2rOuSYO/b
            lZtmtA7SgvQotVQNr37vAAAAD3Jvb3RAa3JlZ3pkZXFpdwECAwQFBg==
            -----END OPENSSH PRIVATE KEY-----
          port: 22
          source: "deploy.zip,secrets.env"
          target: "/home/root/facade-message-bot/deploy/"

  build:
    runs-on: ubuntu-latest
    needs: copy
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: 83.222.26.189
          username: root
          key: |
            key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
            QyNTUxOQAAACAtnFp+Y2e0VUmmNqzrkmDv25WbZrQO0oL0KLVUDa9+7wAAAJhPCWjrTwlo
            6wAAAAtzc2gtZWQyNTUxOQAAACAtnFp+Y2e0VUmmNqzrkmDv25WbZrQO0oL0KLVUDa9+7w
            AAAECpplG++laSSRORFuERvo7Miun9VFaeHJz3Y97hoe18oS2cWn5jZ7RVSaY2rOuSYO/b
            lZtmtA7SgvQotVQNr37vAAAAD3Jvb3RAa3JlZ3pkZXFpdwECAwQFBg==
            -----END OPENSSH PRIVATE KEY-----
          port: 22
          script: |
            cd /home/root/facade-message-bot/deploy/
            unzip -o deploy.zip
            sudo docker compose -f docker-compose.dev.yaml build
            sudo docker compose -f docker-compose.dev.yaml down
            sudo docker compose -f docker-compose.dev.yaml up -d --remove-orphans
            sudo docker image prune -f
            rm deploy.zip
