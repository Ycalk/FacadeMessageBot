name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  
  test-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/bot
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      NAME_API_KEY: ${{ secrets.NAME_API_KEY }}
      POSTGRES_USER: some user
      POSTGRES_PASSWORD: some password
      POSTGRES_DB: some database
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
    
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir poetry==2.1.3
          poetry install --with dev

      - name: Run tests
        run: |
          poetry run pytest --disable-warnings -v
