name: Deploy

on:
  push:
    branches: [main]

jobs:
  test-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/bot
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      NAME_API_KEY: ${{ secrets.NAME_API_KEY }}
      POSTGRES_USER: some user
      POSTGRES_PASSWORD: some password
      POSTGRES_DB: some database
      IS_TESTING: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir poetry==2.1.3
          poetry install --with dev

      - name: Run tests
        run: |
          poetry run pytest --disable-warnings -v

  copy:
    needs: test-bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Archive code for deploy
        run: |
          zip -r deploy.zip . -x '*.git*' '*.github/*'

      - name: Create secrets.env file
        run: |
          echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" >> secrets.env
          echo "NAME_API_KEY=${{ secrets.NAME_API_KEY }}" >> secrets.env
          echo "MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}" >> secrets.env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> secrets.env
          echo "MAIN_ADMIN_ID=${{ secrets.MAIN_ADMIN_ID }}" >> secrets.env
          echo "MEDIA_FACADE_API_TOKEN=${{ secrets.MEDIA_FACADE_API_TOKEN }}" >> secrets.env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> secrets.env
          echo "START_MESSAGE_IMAGE_TOKEN=CUrv9t7NB4FZnKYvq2O5D28Jk+zSQOEz4LZDJL4PPlyewZNmlSSSC9K0CSqpyrLsv9hgMQQpRUhhYc5/VYvxfHDShV7vYYJiYVisJJSPl+mruvQoZspLaGeZJr+TTWFdfvas5H4094r1mO9hhiwat94DapmOkzgKhjcadpBKxduPBBJUixJ8yA==" >> secrets.env
          echo "GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}" >> secrets.env
          echo "GOOGLE_ACCOUNT_CREDENTIALS=$(echo "${{ secrets.GOOGLE_ACCOUNT_CREDENTIALS_BASE64 }}" | base64 -d)" >> secrets.env
          echo "SENTRY_DSN=***REMOVED***" >> secrets.env
          echo "SENTRY_ENV=production" >> secrets.env

      - name: Transfer files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          source: "deploy.zip,secrets.env"
          target: "/home/${{ secrets.SERVER_USER }}/facade-message-bot/deploy/"

  build:
    runs-on: ubuntu-latest
    needs: copy
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/facade-message-bot/deploy/
            unzip -o deploy.zip
            sudo docker compose build
            sudo docker compose down
            sudo docker compose up -d --remove-orphans
            sudo docker image prune -f
            rm deploy.zip
