[project]
name = "bot"
version = "0.1.0"
description = ""
authors = [
    {name = "ycalk",email = "alosev752@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "python-dotenv (>=1.1.1,<2.0.0)",
    "thefuzz (>=0.22.1,<0.23.0)",
    "facade-message-bot-shared-models[full] (>=0.14.0,<0.15.0)",
    "babel (>=2.17.0,<3.0.0)",
    "redis (>=6.4.0,<7.0.0)",
    "httpx (>=0.28.0,<0.29.0)",
    "sentry-sdk (>=2.35.1,<3.0.0)",
    "maxapi[webhook] (>=0.9.5,<0.10.0)",
    "pillow (>=11.3.0,<=11.3.0)"
]


[tool.poetry]
packages = [{include = "bot", from = "src"}]



[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^1.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.scripts]
bot = "bot:run"
get_upload_image_token = "bot:get_upload_image_token"
