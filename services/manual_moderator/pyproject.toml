[project]
name = "manual-moderator"
version = "0.1.0"
description = ""
authors = [
    {name = "ycalk",email = "alosev752@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "python-dotenv (>=1.1.1,<2.0.0)",
    "aiogram (>=3.21.0,<4.0.0)",
    "redis (>=6.3.0,<7.0.0)",
    "facade-message-bot-shared-models[messaging] (>=0.14.0,<0.15.0)",
    "sentry-sdk (>=2.35.1,<3.0.0)"
]

[tool.poetry]
packages = [{include = "manual_moderator", from = "src"}]

[tool.poetry.scripts]
bot = "manual_moderator:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
