[project]
name = "black-list-bot"
version = "0.1.0"
description = ""
authors = [
    {name = "ycalk",email = "alosev752@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "async-max-api (>=0.1.0,<0.2.0)",
    "facade-message-bot-shared-models[messaging] (>=0.11.0,<0.12.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "redis (>=6.4.0,<7.0.0)"
]

[tool.poetry]
packages = [{include = "bot", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.scripts]
bot = "bot:run"